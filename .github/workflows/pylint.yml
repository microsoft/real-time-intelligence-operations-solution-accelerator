name: PyLint

on:
  push:
    paths:
      - 'src/**/*.py'
      - 'infra/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/pylint.yml'
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'infra/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/pylint.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --index-url https://packagefeedproxy.microsoft.io/pypi/simple/ --upgrade pip
          pip install --index-url https://packagefeedproxy.microsoft.io/pypi/simple/ -r requirements.txt
          pip install --index-url https://packagefeedproxy.microsoft.io/pypi/simple/ flake8  # Ensure flake8 is installed explicitly
      
      - name: Run flake8
        run: |
          flake8 src



